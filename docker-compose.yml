# Portainer: standalone Docker stack named "taulellari" (not Swarm).
# Build TAULELLARI_IMAGE on this Docker host before deploying.
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: taulellari
      POSTGRES_USER: taulellari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: /srv/taulellari/postgres_data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${TAULELLARI_IMAGE:?Set TAULELLARI_IMAGE to the locally built image}
    pull_policy: never
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use a hex password (openssl rand -hex 32) so it is URL-safe.
      DATABASE_URL: postgresql://taulellari:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}@db:5432/taulellari
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in Portainer}
      SESSION_COOKIE_SECURE: "false"
      CARTO_API_KEY: ${CARTO_API_KEY:?Set CARTO_API_KEY in Portainer}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:?Set MAPBOX_ACCESS_TOKEN in Portainer}
      PHOTO_STORAGE_DIR: /data/taulellari/photos
    ports:
      - "3001:3000"
    volumes:
      - type: bind
        source: /srv/taulellari/photos
        target: /data/taulellari/photos
        bind:
          create_host_path: false
    networks:
      - web
      - database
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/publicaciones', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    driver: bridge
  database:
    driver: bridge
    internal: true
